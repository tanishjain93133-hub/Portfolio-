<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#14141d" />
      <stop offset="100%" stop-color="#0d0d14" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="50%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232332" />
      <stop offset="100%" stop-color="#161622" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Ambient Glow circles -->
  <circle cx="160" cy="180" r="140" fill="#ff7a00" opacity="0.12" filter="url(#glow)" />
  <circle cx="680" cy="380" r="180" fill="#ff4500" opacity="0.1" filter="url(#glow)" />

  <!-- Mockup Container / Browser Window -->
  <g transform="translate(60, 45)">
    <!-- Browser Window Card -->
    <rect width="680" height="410" rx="16" fill="#12121a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 664 0 Q 680 0 680 16 L 680 44 L 0 44 Z" fill="#1a1a26" />
    <circle cx="24" cy="22" r="5" fill="#ff5f56" />
    <circle cx="40" cy="22" r="5" fill="#ffbd2e" />
    <circle cx="56" cy="22" r="5" fill="#27c93f" />

    <!-- Browser URL Pill -->
    <rect x="180" y="10" width="320" height="24" rx="6" fill="#0d0d14" stroke="rgba(255,255,255,0.06)" />
    <text x="340" y="26" fill="#8e8ea0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="500">
      prmaterialhouse1.vercel.app
    </text>

    <!-- Nav in mock website -->
    <g transform="translate(30, 60)">
      <!-- Logo -->
      <rect x="0" y="4" width="32" height="32" rx="8" fill="url(#primaryGrad)" />
      <text x="16" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" text-anchor="middle">PR</text>
      <text x="42" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="1">PR MATERIAL <tspan fill="#ff7a00">HOUSE</tspan></text>
      
      <!-- Nav items -->
      <text x="400" y="24" fill="#ff7a00" font-family="sans-serif" font-size="11" font-weight="600">Home</text>
      <text x="450" y="24" fill="#9999aa" font-family="sans-serif" font-size="11" font-weight="500">Products</text>
      <text x="520" y="24" fill="#9999aa" font-family="sans-serif" font-size="11" font-weight="500">Cement</text>
      <text x="580" y="24" fill="#9999aa" font-family="sans-serif" font-size="11" font-weight="500">Contact</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(30, 120)">
      <!-- Badge -->
      <rect x="0" y="0" width="220" height="24" rx="12" fill="rgba(255,122,0,0.15)" stroke="rgba(255,122,0,0.3)" />
      <circle cx="12" cy="12" r="3.5" fill="#ff7a00" />
      <text x="24" y="16" fill="#ff9933" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">BUILDING MATERIAL PLATFORM</text>

      <!-- Headline -->
      <text x="0" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5">
        Premium Quality
      </text>
      <text x="0" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5">
        <tspan fill="url(#accentGrad)">Building Materials</tspan> Online
      </text>

      <!-- Subtext -->
      <text x="0" y="106" fill="#8e8ea0" font-family="sans-serif" font-size="11" font-weight="400">
        E-Commerce catalog with dynamic pricing, wholesale quotes &amp; orders.
      </text>

      <!-- CTA Button -->
      <rect x="0" y="125" width="130" height="34" rx="8" fill="url(#primaryGrad)" />
      <text x="65" y="146" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">EXPLORE STORE</text>

      <!-- Secondary button -->
      <rect x="140" y="125" width="120" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="200" y="146" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Get Quote</text>
    </g>

    <!-- Right-hand Product Cards Showcase -->
    <g transform="translate(360, 110)">
      <!-- Featured Product Card -->
      <rect x="0" y="0" width="260" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,122,0,0.3)" stroke-width="1.5" filter="url(#glow)" opacity="0.95" />
      
      <!-- Cement / Material Bag Graphic Illustration -->
      <g transform="translate(30, 20)">
        <rect x="0" y="10" width="60" height="85" rx="6" fill="#2d2d3f" stroke="#ff7a00" stroke-width="1.5" />
        <!-- Bag details -->
        <rect x="8" y="20" width="44" height="20" rx="3" fill="#ff7a00" />
        <text x="30" y="34" fill="#000000" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">CEMENT</text>
        <line x1="8" y1="52" x2="52" y2="52" stroke="#4a4a60" stroke-width="2" />
        <line x1="8" y1="60" x2="40" y2="60" stroke="#4a4a60" stroke-width="2" />
        <line x1="8" y1="68" x2="48" y2="68" stroke="#4a4a60" stroke-width="2" />
        <circle cx="30" cy="80" r="4" fill="#ff7a00" />
      </g>

      <g transform="translate(105, 30)">
        <text x="0" y="15" fill="#ff7a00" font-family="sans-serif" font-size="10" font-weight="700">TOP SELLER</text>
        <text x="0" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">UltraTech 53 Grade</text>
        <text x="0" y="52" fill="#8e8ea0" font-family="sans-serif" font-size="10">High Performance Cement</text>
        <text x="0" y="78" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">₹380 <tspan fill="#8e8ea0" font-size="10" font-weight="400">/ bag</tspan></text>
      </g>

      <!-- Bottom card footer with interactive pills -->
      <g transform="translate(15, 125)">
        <rect x="0" y="0" width="230" height="50" rx="8" fill="#0f0f18" stroke="rgba(255,255,255,0.06)" />
        <text x="15" y="22" fill="#8e8ea0" font-family="sans-serif" font-size="9">Delivery Status</text>
        <text x="15" y="38" fill="#27c93f" font-family="sans-serif" font-size="11" font-weight="700">● Same-Day Dispatch</text>
        
        <rect x="140" y="10" width="75" height="30" rx="6" fill="#ff7a00" />
        <text x="177" y="29" fill="#000" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Order Now</text>
      </g>
    </g>

    <!-- Bottom Features Strip -->
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="620" height="36" rx="8" fill="#181824" stroke="rgba(255,255,255,0.06)" />
      
      <text x="30" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">✓ Full-Stack Catalog</text>
      <text x="180" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">✓ Dynamic Cart &amp; Pricing</text>
      <text x="350" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">✓ WhatsApp Direct Orders</text>
      <text x="520" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">✓ 100% Verified Stock</text>
    </g>
  </g>
</svg>
